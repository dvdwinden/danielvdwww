media:
  input: src/assets
  output: /assets

content:
  - name: links
    label: Links
    type: collection
    path: src/links
    fields:
      - name: layout
        label: Layout
        type: string
        default: narrow.njk
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date & Time
        type: date
        required: true
        format: datetime-local
      - name: tags
        label: Tags
        type: string
        multiple: true
      - name: external_url
        label: External URL
        type: string
        required: true
      - name: bodyClass
        label: Body Class
        type: select
        options:
          - bg-stone
          - bg-blue
          - bg-green
        default: bg-green
      - name: body
        label: Body
        type: rich-text