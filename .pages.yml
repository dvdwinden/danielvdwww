media:
  input: src/assets
  output: /assets

content:
  - name: links
    label: Links
    type: collection
    path: src/links
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: external_url
        label: External URL
        type: string
        required: true
      - name: body
        label: Body
        type: rich-text