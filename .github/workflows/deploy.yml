name: Build and Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache Eleventy build artifacts and processed images
      - name: Cache Eleventy build
        uses: actions/cache@v4
        with:
          path: |
            .cache
            _site
            node_modules/.cache
          key: ${{ runner.os }}-eleventy-${{ hashFiles('**/*.md', '**/*.njk', '**/*.js', '**/*.json', 'src/**/*', '.eleventy.js', 'tailwind.config.*') }}
          restore-keys: |
            ${{ runner.os }}-eleventy-

      # Separate cache for processed images 
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            _site/assets
          key: ${{ runner.os }}-images-${{ hashFiles('src/assets/**/*.{jpg,jpeg,png,webp,avif,JPG,PNG}') }}
          restore-keys: |
            ${{ runner.os }}-images-

      - name: Install dependencies
        run: npm ci

      # Check what files have changed to optimize build process
      - name: Check for changes
        id: changes
        run: |
          # Get list of changed image files
          # Handle case where HEAD~1 might not exist (first commit, etc.)
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_IMAGES=$(git diff --name-only HEAD~1 HEAD | grep "src/assets/.*\.(jpg\|jpeg\|png\|webp\|avif\|JPG\|PNG)" 2>/dev/null | tr '\n' ',' || echo "")
          else
            echo "⚠️ Cannot diff against HEAD~1, treating as full build"
            CHANGED_IMAGES="full_build"
          fi
          
          # Check if images have changed
          if [ -n "$CHANGED_IMAGES" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "images-changed=true" >> $GITHUB_OUTPUT
            echo "🖼️ Image assets have changed:"
            echo "$CHANGED_IMAGES" | tr ',' '\n' | while read -r file; do
              [ -n "$file" ] && echo "  - $file"
            done
            # Export for Eleventy to use
            echo "CHANGED_IMAGES=$CHANGED_IMAGES" >> $GITHUB_ENV
          else
            echo "images-changed=false" >> $GITHUB_OUTPUT
            echo "📷 No image changes detected"
            echo "CHANGED_IMAGES=" >> $GITHUB_ENV
          fi
          
          # Check if CSS/Tailwind files have changed
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q "src/css/\|tailwind.config" 2>/dev/null || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "css-changed=true" >> $GITHUB_OUTPUT
            echo "🎨 CSS/Tailwind files have changed"
          else
            echo "css-changed=false" >> $GITHUB_OUTPUT
            echo "🎨 No CSS changes detected"
          fi

      # Build site with incremental builds when possible
      - name: Build site
        run: |
          # Use incremental build for faster processing
          if [ "${{ steps.changes.outputs.images-changed }}" = "false" ] && [ -d "_site" ]; then
            echo "🚀 Using incremental build (images cached)"
            NODE_ENV=production node --max-old-space-size=4096 ./node_modules/.bin/eleventy --incremental
          else
            echo "🔄 Full build (images changed or first build)"
            NODE_ENV=production node --max-old-space-size=4096 ./node_modules/.bin/eleventy
          fi
          
          # Always rebuild CSS to ensure completeness
          # TailwindCSS scans the entire built site so it needs to run after Eleventy
          echo "🎨 Building CSS"
          npx tailwindcss -i ./src/css/style.css -o ./_site/css/style.css --minify
          
          # Verify CSS was built successfully
          if [ ! -f "_site/css/style.css" ] || [ ! -s "_site/css/style.css" ]; then
            echo "❌ CSS build failed or file is empty!"
            exit 1
          else
            echo "✅ CSS file verified ($(wc -c < _site/css/style.css) bytes)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
